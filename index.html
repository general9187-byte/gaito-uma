#ui.pass>.sp[data-k]{pointer-events:auto}

function assign(){
 G.place={voi:[],sta:[],pow:[],tru:[],pol:[]};
 G.deck.forEach(c=>{
  const w=TR.map(t=>t.k===c.t?4:1),tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot,i=0;

 });
}

 let gt;
 if(nextGoal===undefined)gt=`投票日（選挙レース）まで あと ${G.N-G.t+1}ターン`;
 else if(idx===1)gt=`第${nextGoal}ターン：公開討論会 まで あと ${nextGoal-G.t+1}ターン`;

 if(failed){
  G.failed++;

  txt=`😵 ${T.n}に 失敗…！ ${SN[loss]}が -6、 気分も おちこんだ…`;
 }else{
  addSt(pv.g);G.energy+=T.en;G.sp+=pv.sp;G.tcount[k]++;
  G.place[k].forEach(c=>{addBond(c,7+(isFr(c,k)?3:0))});

  txt=`${pv.fr.length?"🌟友情トレーニング！ ":"✅ "}${T.n} せいこう！ ${parts}`;

  const r=()=>clamp(base*rnd(.85,1.15),.3,2);
  const st=pick(Object.keys(STRAT));
  return{name:n,color:c,hair:pick([0x2a2a2a,0x6b4a2a,0xb08040,0x888888]),x:{voi:r(),sta:r(),pow:r(),tru:r(),pol:r()},strat:st,skills:shuffle(SKILLS.filter(s=>s.ph!==-1)).slice(0,1+Math.floor(Math.random()*2)).map(s=>s.id)};
 });
 runners=[pl,...rv];
 const lanes=shuffle([0,1,2,3,4,5]);
 runners.forEach((r,i)=>{
  r.lane=lanes[i];r.pos=0;r.hp=100*clamp(.55+.45*r.x.sta,.4,1.5);r.hp0=r.hp;r.noise=[0,0,0,0];r.phase=-1;r.act=[];r.fin=null;r.sdone={};r.deb=0;
  r.m=makeHero(r.color,r.hair,r.pl?G.cand.style:Math.floor(Math.random()*3));r.m.scale.setScalar(.8);r.m.rotation.y=Math.PI/2;r.m.position.set(0,0,r.lane*2.6);raceG.add(r.m);
 });
 const mk=new THREE.Mesh(new THREE.ConeGeometry(.45,.9,4),mat(0xffe36b,{emissive:0x886600}));mk.rotation.x=Math.PI;RC.mk=mk;raceG.add(mk);
}
function rankList(){return runners.slice().sort((a,b)=>(b.fin!==null?2-b.fin/1000:b.pos)-(a.fin!==null?2-a.fin/1000:a.pos))}
function startRace(){
 closeSheet();mode="race";setBg(0xa8dcff);$("cmt").innerHTML="";
 if(hero)hero.parent&&hero.parent.remove(hero);
 makeRunners();
 RC.state="count";RC.cd=3.2;cam.position.set(2003,13,21);
 const p=runners[0];RC.cam=new THREE.Vector3();
 ui(`<div class="sp"></div><div id="rk"></div><div style="height:8px"></div><button id="tap" data-k="tap">応援 れんだ！！</button>`,true);
 $("tap").style.visibility="hidden";
 cmt("🏁 まもなく 開票レース スタート！");
}
function cmt(t){$("cmt").style.top="max(8px,env(safe-area-inset-top))";$("cmt").innerHTML=`<div class="panel" style="font-size:13.5px;text-align:center">${t}</div>`}
function phaseOf(p){return p<PH[0]?0:p<PH[1]?1:p<PH[2]?2:3}
function runnerSpeed(r,dt){
 const b=1/36,ph=phaseOf(r.pos),S=STRAT[r.strat].m;
 let f;
 if(ph===0)f=(1+.05*(r.x.pow-1)+.02*(r.x.voi-1))*S[0];
 else if(ph===1)f=(1+.05*(r.x.voi-1)+.02*(r.x.pol-1))*S[1];
 else if(ph===2)f=(1+.05*(r.x.voi-1)+.04*(r.x.pow-1))*S[2];
 else f=(1+.07*(r.x.tru-1)+.05*(r.x.pow-1)+.04*(r.x.voi-1))*S[3];
 f*=1+(r.apt||0)+r.noise[ph];
 // スキル
 let imm=false;
 r.act=r.act.filter(a=>(a.t-=dt)>0);
 r.act.forEach(a=>{if(a.s.spd)f*=1+a.s.spd;if(a.s.immune)imm=true});
 if(r.deb>0){f*=1-r.deb;r.deb=Math.max(0,r.deb-dt*.02)}
 if(r.hp<=0&&!imm)f*=.86;
 if(r.pl&&RC.tapBoost>0)f*=1+RC.tapBoost;
 return{spd:b*f,rel:f};
}
function enterPhase(r,ph){
 r.phase=ph;
 const prob=clamp(.25+.5*r.x.pol/1.2,.2,.92);
 r.skills.forEach(id=>{
  const s=SKILLS.find(q=>q.id===id);if(!s)return;
  if(s.ph!==ph&&s.ph!==-1)return;
  if(s.ph===-1){r.act.push({s,t:99});return}
  if(r.sdone[id])return;r.sdone[id]=true;
  if(s.behind){const rk=rankList().indexOf(r)+1;if(rk<=2)return}
  if(Math.random()<prob){
   if(s.hp)r.hp=Math.min(r.hp0*1.1,r.hp+s.hp);
   if(s.deb){const top=rankList().find(q=>q!==r);if(top)top.deb=s.deb}
   r.act.push({s,t:3.2});
   if(r.pl){cmt(`✨ スキル発動！「${s.n}」`);sfx.gacha();if(r.m)flashSkill()}
  }
 });
}
function flashSkill(){const b=document.body;b.classList.remove("flash");void b.offsetWidth;b.classList.add("flash")}
function updateRace(dt){
 const p0=runners[0];
 if(RC.state==="count"){
  RC.cd-=dt;
  runners.forEach(r=>animHero(r.m,0,dt));
  const n=Math.ceil(RC.cd);
  if(RC.lastN!==n&&n>0&&n<=3){RC.lastN=n;cmt(`<span style="font-size:30px">${n}</span>`);sfx.tick()}
  if(RC.cd<=0){RC.state="run";cmt("🏁 スタート！！");sfx.win();runners.forEach(r=>{r.noise=[0,1,2,3].map(()=>rnd(-.012,.012))})}
 }else if(RC.state==="run"||RC.state==="end"){
  RC.t+=dt;
  RC.tapBoost=Math.max(0,RC.tapBoost-dt*.06);
  runners.forEach(r=>{
   if(r.fin!==null){r.pos+=r.endSp*dt*.5;animHero(r.m,.6,dt);r.m.position.x=r.pos*RC.L;return}
   const ph=phaseOf(r.pos);if(ph!==r.phase)enterPhase(r,ph);
   const{spd,rel}=runnerSpeed(r,dt);
   r.pos+=spd*dt;
   const dr=3.2*Math.pow(rel,2.5)*(ph===0?STRAT[r.strat].hp:1)*(ph===3?1.1:1);
   r.hp=Math.max(0,r.hp-dr*dt*(r.hp0/100>1?.9:1));
   if(r.pos>=1){r.fin=RC.t;r.endSp=spd;RC.finished.push(r)}
   r.m.position.x=r.pos*RC.L;animHero(r.m,1.1+rel*0.2,dt);
   r.m.position.y=Math.abs(Math.sin(r.m.userData.phase))*.18;
  });
  const near=!p0.fin&&p0.pos>.76;
  const tb=$("tap");if(tb)tb.style.visibility=near?"visible":"hidden";
  if(near&&!RC.spark){RC.spark=true;cmt("🔥 ラストスパート！ れんだで 応援しよう！")}
  if(RC.state==="run"&&p0.fin!==null){RC.state="end";RC.endT=2.2;}
  if(RC.state==="end"){RC.endT-=dt;if(RC.endT<=0||RC.finished.length>=6){RC.state="done";raceEnd()}}
  RC.msgT-=dt;
  if(RC.msgT<=0&&RC.state==="run"){
   RC.msgT=3.2;const rk=rankList(),i=rk.indexOf(p0)+1;
   if(!RC.spark)cmt(`実況「現在 ${rk[0].name} が トップ！ ${G.cand.n}は ${i}位！」`);
  }
 }
 // かめら
 const tgt=p0.m.position;
 const cx=2000+tgt.x+3,cy=13,cz=21;
 if(Math.abs(cx-cam.position.x)>15)cam.position.x=cx;cam.position.x+=(cx-cam.position.x)*Math.min(1,dt*5);cam.position.y=cy;cam.position.z=cz;
 cam.lookAt(cam.position.x,0,5);
 RC.mk.position.set(p0.m.position.x,4.6+Math.sin(performance.now()/200)*.2,p0.m.position.z);RC.mk.rotation.y+=dt*3;
 // ランキング
 if(!RC.acc)RC.acc=0;RC.acc+=dt;
 if(RC.acc>.12&&$("rk")){RC.acc=0;
  const rk=rankList();
  $("rk").innerHTML=rk.map((r,i)=>`<div class="rk"><b style="width:18px">${i+1}</b><span style="width:70px;${r.pl?"color:#ffe36b":""}">${r.name}</span><div class="bar"><i style="width:${Math.min(100,r.pos*100)}%;${r.pl?"background:var(--gold)":""}"></i></div><span style="width:62px;text-align:right">${Math.round(Math.min(1,r.pos)*(r.pl?1:1)*(8000+Math.round(r.x.pol*1000)))}票</span></div>`).join("");
 }
}
function tapRace(){
 if(!RC||RC.state!=="run")return;
 if(runners[0].pos<.76)return;
 RC.tapBoost=Math.min(.08,RC.tapBoost+.012);sfx.tick();
}
function raceEnd(){
 const order=RC.finished.slice();
 runners.forEach(r=>{if(!order.includes(r))order.push(r)});
 const rank=order.indexOf(runners[0])+1;
 const W=[34,23,17,12,8,6],T=30000;
 const votes=order.map((r,i)=>Math.round(T*W[i]/100*rnd(.97,1.03)));
 raceResult(rank,order,votes);
}

/* ================= 結果 ================= */
function evalStats(){
 const total=SK.reduce((a,k)=>a+G.st[k],0)+G.skills.length*40;
 const r=total/(5*G.NORM);
 const grade=r<.45?"E":r<.6?"D":r<.75?"C":r<.9?"B":r<1.05?"A":r<1.25?"S":"SS";
 return{total,grade,pts:Math.round(total)};
}
function raceResult(rank,order,votes,over){
 const e=evalStats();
 const gem=over?40:[400,250,150,100,80,60][rank-1];
 SV.gems+=gem;
 const mainK=SK.slice().sort((a,b)=>G.st[b]-G.st[a])[0];
 const stars=over?1:rank===1?3:rank<=3?2:1;
 const skill=G.skills.length?pick(G.skills):null;
 const entry={cand:G.cand.n,rank:over?0:rank,eval:e.pts,grade:e.grade,turns:G.N,date:todayS()};
 SV.hist.unshift(entry);SV.hist=SV.hist.slice(0,10);
 SV.legacy.unshift({name:G.cand.n,main:mainK,stars,skill});SV.legacy=SV.legacy.slice(0,5);
 save();
 sfx[rank===1&&!over?"win":"bad"]();
 mode="done";
 $("cmt").innerHTML="";
 const win=!over&&rank===1;
 if(!over){setBg(win?0xfff2b0:0xcfd8e8)}
 ui(`<div class="sp"></div>`,true);
 sheet(over?`<h2>🏁 育成 しゅうりょう</h2><div class="big">😢</div><p style="text-align:center">立候補に 届かなかった…。 でも 経験は むだじゃない！</p>
  <p style="text-align:center">評価 <b>${e.grade}</b>（${e.pts}てん）　ジェム +${gem}</p>`:
  `<h2>📺 開票結果</h2><div class="big">${win?"🎊 当選！！":rank<=3?"😢 おしくも 落選":"🌧️ 落選…"}</div>
  ${order.map((r,i)=>`<div class="row" style="font-size:13px;margin:2px 0;${r.pl?"background:#fff3b0;border-radius:8px;padding:2px 4px":""}"><b style="width:22px">${i+1}</b><span style="flex:1">${r.name}</span><span>${votes[i].toLocaleString()}票</span></div>`).join("")}
  <p style="text-align:center;margin-top:8px">育成 評価 <b style="font-size:22px">${e.grade}</b>（${e.pts}てん）　ジェム +${gem}${G.refused?"　🕊️ クリーン選挙！":""}</p>`
  +`<div class="memo"><b>📝 今回 まなんだこと</b><ul class="tips">${G.seen.map(t=>`<li>${t}</li>`).join("")}<li><b>開票</b>：票を 数えて いちばん 多い 人が 当選。 たった 1票でも 結果が かわることが あるよ。</li></ul></div>
  <p style="font-size:12px">継承：次の 育成で ${"★".repeat(stars)} の 力を ひきつげるよ（${SN[mainK]}${skill?" ／ スキル「"+SKILLS.find(s=>s.id===skill).n+"」":""}）</p>
  <button class="btn pk" data-k="home">ホームへ</button>`);
}

/* ================= ガチャ ================= */
function pull(){
 const r=Math.random();
 const rar=r<.03?"SSR":r<.21?"SR":"R";
 return pick(CARDS.filter(c=>c.r===rar));
}
function gacha(){
 mode="home";
 ui(`<div style="text-align:center;margin-top:6px"><h1>🎰 サポートカード<br>ガチャ</h1></div><div class="sp"></div>
 <div class="panel"><div class="row" style="justify-content:space-between"><span class="pill">💎 ${SV.gems}</span><span class="pill g">${SV.pulls}回 ひいた</span></div>
 <p style="margin:6px 0 0;font-size:12.5px">排出：SSR 3% ／ SR 18% ／ R 79%（10れんは SR いじょう 1まい かくてい）<br>おなじ カードが でると <b>限界突破</b>（効果アップ・最大4）！</p></div>
 <button class="btn" data-k="p1" ${SV.gems<150?"disabled":""}>1回 ひく（💎150）</button>
 <button class="btn pk" data-k="p10" ${SV.gems<1500?"disabled":""}>10れん（💎1500）</button>
 <button class="btn sub" data-k="home">もどる</button>`);
}
function doPulls(n){
 const cost=n===1?150:1500;if(SV.gems<cost)return;
 SV.gems-=cost;const res=[];
 for(let i=0;i<n;i++){let c=pull();if(n===10&&i===9&&!res.some(x=>x.r!=="R"))c=pick(CARDS.filter(q=>q.r==="SR"));
  res.push(c);SV.pulls++;
  if(SV.cards[c.id]==null)SV.cards[c.id]=0;else SV.cards[c.id]=Math.min(4,SV.cards[c.id]+1)}
 save();sfx.gacha();
 const best=res.some(c=>c.r==="SSR");
 if(best)setTimeout(sfx.win,500);
 sheet(`<h2>${best?"🌈 SSR 登場！！":"🎰 けっか"}</h2><div class="grid3">${res.map(c=>`<div class="crd ${c.r}"><div class="em">${c.e}</div><span class="rar">${c.r}</span> ${c.n}<br><small>${c.role}</small><br><small>${SN[c.t]} ／ 突破 ${lbOf(c.id)}</small></div>`).join("")}</div>
 <button class="btn" data-k="gacha">もどる</button>`);
}
function cards(){
 mode="home";
 ui(`<div class="panel" style="margin-top:6px;overflow:auto;max-height:92%"><h2>🃏 サポートカード</h2>
 <p style="font-size:12.5px;margin:0">${Object.keys(SV.cards).length}/${CARDS.length}まい もっているよ（ガチャで ふやそう）</p>
 <div class="grid3">${CARDS.map(c=>{const own=SV.cards[c.id]!=null,b=cbonus(c);return `<div class="crd ${c.r} ${own?"":"lock"}"><div class="em">${own?c.e:"❓"}</div><span class="rar">${c.r}</span> ${own?c.n:"???"}<br><small>${own?c.role+"<br>"+SN[c.t]+" 練習 +"+b.tr+"% ／ 友情 +"+b.fr+"%<br>突破 "+lbOf(c.id)+"/4":"みつけて ないよ"}</small></div>`}).join("")}</div>
 <button class="btn sub" data-k="home">もどる</button></div>`);
}
function hist(){
 mode="home";
 ui(`<div class="panel" style="margin-top:6px"><h2>📜 きろく</h2>${SV.hist.length?SV.hist.map(h=>`<div class="row" style="font-size:13px;margin:3px 0"><span class="pill">${h.date}</span><span style="flex:1">${h.cand}（${h.turns}T）</span><b>${h.rank?h.rank+"位":"未出馬"}</b><span class="pill g">評価 ${h.grade}</span></div>`).join(""):"<p>まだ きろくが ないよ</p>"}
 <button class="btn sub" data-k="home">もどる</button></div>`);
}

/* ================= イベント処理 ================= */
const H={
 cand:v=>{selCand=+v;home()},
 setup:()=>{selDeck=null;setup()},
 turns:v=>{selTurns=+v;setup()},
 leg:v=>{selLeg=+v;setup()},
 deck:v=>{const i=selDeck.indexOf(v);if(i>=0)selDeck.splice(i,1);else if(selDeck.length<5)selDeck.push(v);setup()},
 start:()=>{
  const cand=CAND[selCand];newGame(cand,selTurns,selLeg>=0?SV.legacy[selLeg]:null,selDeck.slice());
  SV.deck=selDeck.slice();save();
  mode="train";hero.parent&&homeG.add(hero);
  assign();
  sheet(`<h2>📅 告示日！</h2><div class="big">${cand.n}</div><p style="text-align:center">${selTurns}ターンの 選挙戦が はじまる！<br>練習で 力を つけ、 目標を クリアして、 投票日の 選挙レースに 勝とう！</p><div class="memo"><b>📝 ことばメモ</b><br>${TIPS.a}<br>${TIPS.b}</div><button class="btn" data-k="go">がんばる！</button>`);
  G.seen.push(TIPS.a,TIPS.b);
 },
 go:()=>{closeSheet();train(null);stage(`${G.cand.n}「よろしくお願いします！」`)},
 tr:v=>pickTrain(v),
 rest:()=>doRest(),out:()=>doOut(),
 skills:()=>skillSheet(),sheetS:()=>infoSheet(),
 skillsP:()=>skillSheet("prep"),prep:()=>prep(),
 buy:v=>{const[id,b]=v.split("|"),s=SKILLS.find(x=>x.id===id),c=skCost(s);if(G.sp>=c&&!G.skills.includes(id)){G.sp-=c;G.skills.push(id);sfx.ok()}skillSheet(b)},
 closeS:()=>{closeSheet()},
 ev:v=>resolveEvt(v),sev:v=>resolveSev(v),
 next:()=>nextTurn(),
 afterGoal:()=>afterGoal(),
 deb:v=>debPick(+v),
 gameover:()=>{closeSheet();raceResult(0,[],[],true)},
 strat:v=>{G.strat=v;prep()},
 race:()=>startRace(),
 tap:()=>tapRace(),
 home:()=>{closeSheet();home()},toHome:()=>{sfx.ok();home()},howto:()=>howto(),
 gacha:()=>{closeSheet();gacha()},p1:()=>doPulls(1),p10:()=>doPulls(10),
 cards:()=>cards(),hist:()=>hist()
};
document.addEventListener("pointerdown",e=>{
 const t=e.target.closest("[data-k]");if(!t||t.disabled)return;
 e.preventDefault();H[t.dataset.k]&&H[t.dataset.k](t.dataset.v);
},true);
addEventListener("keydown",e=>{if(mode==="race"&&(e.code==="Space"||e.code==="Enter")){e.preventDefault();tapRace()}});

/* ================= ループ ================= */
const clock=new THREE.Clock();
function frame(){
 const dt=Math.min(clock.getDelta(),.05),t=performance.now()/1000;
 let fx=0,fz=0;
 if(mode==="race"&&RC){updateRace(dt);fx=2000+runners[0].m.position.x;fz=6;
  crowdArr.forEach(c=>{const run=RC.state==="run";c.ph+=dt*(run?7:3);const j=Math.max(0,Math.sin(c.ph));c.g.position.y=c.y+(run?j*.12:0);c.a1.rotation.z=run?.4+j*1.8:.1;c.a2.rotation.z=run?-.4-j*1.8:-.1})}
 else if(mode==="title"){
  cam.position.set(Math.sin(t*.25)*2.4,3.0,10.8);cam.lookAt(0,2.1,0);
  titleHeroes.forEach((h,i)=>{h.userData.armR.rotation.z=-2.6+Math.sin(t*5+i*1.3)*.4;h.position.y=.35+Math.abs(Math.sin(t*2.5+i))*.07});
 }
 else if(hero){
  if(mode==="home"){hero.rotation.y+=dt*.8;animHero(hero,0,dt);camHome()}
  else{hero.rotation.y*=.9;animHero(hero,heroSpeed,dt);hero.position.y=.35+(heroSpeed?Math.abs(Math.sin(hero.userData.phase))*.15:0)}
  if(mode==="train"){cam.position.set(0,2.6,8.4);cam.lookAt(0,2.3,0)}
 }
 if(sparkles&&mode!=="race"){sparkles.rotation.y=t*.06;sparkles.position.y=Math.sin(t)*.15}
 sky.position.copy(cam.position);sky.rotation.y=t*.004;
 sun.position.set(fx+10,25,fz+14);sun.target.position.set(fx,0,fz);sun.target.updateMatrixWorld();
 renderer.render(scene,cam);requestAnimationFrame(frame);
}
title();frame();
</script>
