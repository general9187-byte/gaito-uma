<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff9ec7">
<title>せんきょ プロデュース</title>
<style>
:root{--ink:#2b2140;--paper:#fffbf2;--pink:#ff6fa5;--gold:#ffcf3a;--blue:#3f8cff;--green:#3bb36b;--red:#e0442f;--purple:#8a5cf5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd6e7;color:var(--ink);overscroll-behavior:none;
 font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:max(6px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));pointer-events:none}
#ui>*{pointer-events:auto}
#ui.pass>.sp{pointer-events:none}
.sp{flex:1;min-height:0}
.panel{background:#fffbf2ee;border:3px solid var(--ink);border-radius:14px;padding:7px 9px;box-shadow:0 3px 0 #0003}
.pill{display:inline-block;background:var(--ink);color:#fff;border-radius:9px;padding:3px 9px;font-size:12.5px;white-space:nowrap}
.pill.g{background:var(--gold);color:var(--ink)}.pill.p{background:var(--pink)}
.bar{height:12px;border-radius:7px;background:#0002;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;transition:width .35s}
.row{display:flex;gap:6px;align-items:center}
.wrap{display:flex;gap:6px;flex-wrap:wrap}
#stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.stc{background:#fff;border:2px solid var(--ink);border-radius:9px;text-align:center;font-size:11px;padding:2px 0;line-height:1.25}
.stc b{display:block;font-size:17px}
.stc em{font-style:normal;color:var(--green);font-size:12px;display:block;min-height:15px}
#tr{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tb{position:relative;background:#fff;border:3px solid var(--ink);border-radius:13px;padding:14px 2px 5px;text-align:center;font-size:12px;line-height:1.25;box-shadow:0 4px 0 var(--ink);min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
.tb .ic{font-size:24px}
.tb.sel{background:var(--gold);transform:translateY(-8px);box-shadow:0 12px 0 var(--ink)}
.tb .fail{position:absolute;right:-4px;bottom:-9px;font-size:11px;background:var(--red);color:#fff;border-radius:8px;padding:0 5px;border:2px solid var(--ink)}
.tb .fail.ok{background:var(--green)}
.tb .cards{position:absolute;left:0;right:0;top:-13px;display:flex;justify-content:center;gap:1px}
.cd{width:25px;height:25px;border-radius:50%;background:#fff;border:2px solid var(--ink);font-size:14px;display:flex;align-items:center;justify-content:center}
.cd.fr{box-shadow:0 0 0 3px var(--gold),0 0 10px 2px #ff0;animation:pl .8s infinite alternate}
@keyframes pl{to{transform:scale(1.15)}}
.mini{flex:1;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:7px 2px;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.mini:active,.btn:active,.opt:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn{display:block;width:100%;margin-top:8px;background:var(--gold);border:3px solid var(--ink);border-radius:12px;padding:10px;font-size:17px;box-shadow:0 4px 0 var(--ink)}
.btn.sub{background:#fff;font-size:14px;padding:8px}.btn.pk{background:var(--pink);color:#fff}
.btn:disabled,.opt:disabled,.mini:disabled{opacity:.4}
#sheet{position:fixed;inset:0;background:#2b214099;display:flex;align-items:center;justify-content:center;padding:12px;z-index:10;overflow:auto}
#box{width:100%;max-width:500px;max-height:100%;overflow:auto}
h1{margin:0;font-size:28px;text-align:center;line-height:1.2;color:#fff;text-shadow:0 3px 0 var(--ink),3px 0 var(--ink),-3px 0 var(--ink),0 -3px 0 var(--ink)}
h2{margin:0 0 6px;font-size:18px}
p{margin:5px 0;line-height:1.55;font-size:13.5px}
small{font-size:11.5px}
.memo{background:#eaf3ff;border:2px dashed var(--blue);border-radius:10px;padding:6px 9px;font-size:12.5px;line-height:1.55;margin:7px 0}
.memo b{color:var(--blue)}
.opt{display:block;width:100%;text-align:left;margin-top:7px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.45;box-shadow:0 3px 0 var(--ink)}
.opt.on{background:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.crd{border:3px solid var(--ink);border-radius:11px;padding:5px;background:#fff;font-size:11.5px;line-height:1.35;text-align:center}
.crd .em{font-size:26px}
.crd.SSR{background:linear-gradient(135deg,#fff3b0,#ffd0f0,#c9e8ff)}.crd.SR{background:#fff0c4}.crd.R{background:#e5edf6}
.crd.on{outline:4px solid var(--pink)}
.crd.lock{opacity:.4}
.rar{font-size:11px;background:var(--ink);color:#fff;border-radius:6px;padding:0 5px}
.big{font-size:34px;text-align:center;line-height:1.2;margin:4px 0}
ul.tips{padding-left:18px;margin:4px 0;font-size:12.5px;line-height:1.6}
.rk{display:flex;align-items:center;gap:5px;font-size:11.5px;margin:2px 0;color:#fff;text-shadow:0 1px 0 #000a}
.rk .bar{flex:1;height:8px;border-width:1.5px}
.rk .bar i{background:var(--pink)}
#toast{position:fixed;left:50%;top:26%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:8px 16px;font-size:16px;opacity:0;pointer-events:none;z-index:20;white-space:nowrap;max-width:94vw}
#toast.go{animation:tt 1.7s}
@keyframes tt{0%{opacity:0;transform:translate(-50%,10px)}12%,78%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-14px)}}
#cmt{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));max-width:540px;margin:0 auto;pointer-events:none}
#tap{height:92px;border:4px solid var(--ink);border-radius:22px;background:var(--red);color:#fff;font-size:26px;box-shadow:0 6px 0 var(--ink);width:100%}
#tap:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.flash{animation:fl .9s}
@keyframes fl{0%{box-shadow:0 0 0 0 #fff}50%{box-shadow:0 0 40px 20px #ffe}100%{box-shadow:0 0 0 0 #fff}}
.logo{font-size:44px;margin:6px 0 0;line-height:1.12;letter-spacing:.04em;background:linear-gradient(#fff,#ffd0e8);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px var(--ink);paint-order:stroke;text-shadow:none;filter:drop-shadow(0 4px 0 #2b2140)}
.blink{text-align:center;color:#fff;font-size:20px;text-shadow:0 2px 0 var(--ink),2px 0 var(--ink),-2px 0 var(--ink),0 -2px 0 var(--ink);animation:bl 1.2s infinite;margin-bottom:10px;padding:8px}
@keyframes bl{50%{opacity:.25}}
#ui.pass>.sp[data-k]{pointer-events:auto}
.fl{float:left;width:92px;margin:0 10px 6px 0;border-radius:10px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 3px 0 #0003}
.fl svg,.crd .art svg{width:100%;height:auto;display:block}
.crd .art{border-radius:8px;overflow:hidden;margin-bottom:3px;border:2px solid var(--ink)}
.lockart{aspect-ratio:200/260;display:flex;align-items:center;justify-content:center;font-size:30px;background:#ccd}
.cd{width:30px;height:30px;overflow:hidden}.cd svg{width:100%;height:100%;display:block}
#gc{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 40%,#4a3490,#150b2c 75%);overflow:hidden;color:#fff;text-align:center;display:flex;align-items:center;justify-content:center}
#gc.shake{animation:shk .1s infinite}
@keyframes shk{0%{transform:translate(3px,2px)}25%{transform:translate(-3px,-2px)}50%{transform:translate(2px,-3px)}75%{transform:translate(-2px,3px)}100%{transform:translate(3px,2px)}}
#gcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#gst{position:relative;z-index:2;width:100%}
.rays{position:absolute;width:170vmax;height:170vmax;left:50%;top:42%;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(rgba(255,255,255,.3) 0 6deg,transparent 6deg 16deg);animation:spn 9s linear infinite;z-index:1;border-radius:50%}
@keyframes spn{to{transform:rotate(360deg)}}
.orbwrap{display:flex;flex-direction:column;align-items:center;gap:22px}
.orb{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--oc) 55%,#10081f 135%);box-shadow:0 0 50px 14px var(--oc),0 0 120px 40px var(--oc);animation:orbf .45s infinite alternate;transition:box-shadow .4s}
.orb.rb{animation:orbf .2s infinite alternate,rbw 1s linear infinite}
@keyframes orbf{from{transform:translateY(-8px) rotate(-8deg) scale(1)}to{transform:translateY(8px) rotate(8deg) scale(1.08)}}
@keyframes rbw{to{filter:hue-rotate(360deg)}}
.orbtxt{font-size:22px;letter-spacing:.4em;animation:bl 1s infinite}
#gflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
#gflash.go{animation:gf .6s}
@keyframes gf{0%{opacity:1}100%{opacity:0}}
.gcardwrap{display:inline-block;padding:6px;border-radius:20px;animation:flp .75s cubic-bezier(.2,1.2,.4,1)}
.gcardwrap.R{background:linear-gradient(135deg,#dde6f2,#9aa8bd)}
.gcardwrap.SR{background:linear-gradient(135deg,#fff0a0,#e8a21a,#fff0a0);box-shadow:0 0 40px #ffcf3a}
.gcardwrap.SSR{background:linear-gradient(120deg,#ff6fa5,#ffcf3a,#7cf0a0,#5ab0ff,#c88aff,#ff6fa5);background-size:300% 300%;animation:flp .75s cubic-bezier(.2,1.2,.4,1),holo 2.4s linear infinite;box-shadow:0 0 60px #ff6fe0,0 0 120px #ffcf3a}
@keyframes holo{to{background-position:300% 0}}
@keyframes flp{from{transform:rotateY(100deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
.gcard{width:min(58vw,250px);border-radius:14px;overflow:hidden;background:#fff}
.gcard svg{display:block;width:100%;height:auto}
.gname{font-size:28px;margin-top:12px;text-shadow:0 3px 0 #000a}
.grole{font-size:15px;margin-top:2px}
.gbadge{display:inline-block;margin:8px 4px 0;background:var(--pink);border-radius:10px;padding:3px 12px;font-size:14px}
.ghint{margin-top:12px;font-size:12px;opacity:.7;animation:bl 1.4s infinite}
.gskip{position:absolute;right:10px;top:max(10px,env(safe-area-inset-top));z-index:6;background:#fffc;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-size:13px;color:var(--ink)}
#gcnt{position:absolute;left:12px;top:max(14px,env(safe-area-inset-top));z-index:6;font-size:14px;background:#0006;border-radius:10px;padding:3px 10px}
.scn{position:relative;height:270px;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#cde;touch-action:manipulation;user-select:none;margin-bottom:8px}
.scn.dark:before{content:"";position:absolute;inset:0;background:rgba(10,10,40,.45);z-index:4;pointer-events:none}
.scn.shk{animation:shk2 .08s 6}
@keyframes shk2{0%{transform:translateX(0)}25%{transform:translateX(6px)}75%{transform:translateX(-6px)}100%{transform:translateX(0)}}
#scbg,.scbg2{position:absolute;inset:0}.scbg2{animation:fin .7s forwards}@keyframes fin{from{opacity:0}to{opacity:1}}
#scbg svg,.scbg2 svg{width:100%;height:100%;display:block}
#scact,#scfx{position:absolute;inset:0;pointer-events:none}
#scfx{z-index:5;overflow:hidden}
.act{position:absolute;transform:translateX(-50%);width:var(--w,90px);transition:left .9s ease,bottom .9s ease,opacity .4s;z-index:2;pointer-events:none}
.act .ain svg{width:100%;height:auto;display:block;overflow:visible}
.act .ain{transform-origin:50% 100%}
.act.popin .ain{animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
.emo{display:block;font-size:44px;line-height:1;text-align:center}
.chibi g{transform-box:fill-box}.ch-legL,.ch-legR,.ch-armL,.ch-armR{transform-origin:50% 0}
.a-walk .ch-legL,.a-run .ch-legL,.a-walk .ch-armR,.a-run .ch-armR{animation:lgA .5s infinite alternate}
.a-walk .ch-legR,.a-run .ch-legR,.a-walk .ch-armL,.a-run .ch-armL{animation:lgB .5s infinite alternate}
.a-run .ch-legL,.a-run .ch-legR,.a-run .ch-armL,.a-run .ch-armR{animation-duration:.25s}
@keyframes lgA{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes lgB{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
.a-cheer .ch-armL,.a-jump .ch-armL{animation:chL .45s infinite alternate}.a-cheer .ch-armR,.a-jump .ch-armR{animation:chR .45s infinite alternate}
@keyframes chL{from{transform:rotate(150deg)}to{transform:rotate(172deg)}}@keyframes chR{from{transform:rotate(-150deg)}to{transform:rotate(-172deg)}}
.a-wave .ch-armR{animation:chR .4s infinite alternate}
.a-bounce{animation:bnc .5s ease-in-out infinite}.a-cheer{animation:bnc .45s ease-in-out infinite}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.a-jump{animation:jmp .6s ease-out infinite}@keyframes jmp{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
.a-shake{animation:shk2 .12s 8}
.a-nod{animation:nod 1s ease-in-out infinite}@keyframes nod{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(3deg) translateY(4px)}}
.a-spin{animation:spn2 1.3s linear infinite}@keyframes spn2{to{transform:rotateY(360deg)}}
.a-sway{animation:swy 1.4s ease-in-out infinite alternate}@keyframes swy{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.a-float{animation:flt 1.6s ease-in-out infinite alternate}@keyframes flt{from{transform:translateY(-6px)}to{transform:translateY(8px)}}
.a-droop{transform:rotate(7deg) translateY(8px)}
.a-walk{animation:wlk .5s ease-in-out infinite}.a-run{animation:wlk .25s ease-in-out infinite}
@keyframes wlk{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.fxp{position:absolute;pointer-events:none;top:-10%}
.fall{animation:fall 2.6s linear forwards}@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(320px) rotate(360deg);opacity:.8}}
.rise{top:84%;animation:rise 2.2s ease-out forwards}@keyframes rise{to{transform:translateY(-200px);opacity:0}}
.popfx{animation:popf 1.6s ease-out forwards}@keyframes popf{0%{transform:scale(0)}30%{transform:scale(1.5)}100%{transform:scale(1) translateY(-20px);opacity:0}}
.twinkle{animation:twk 1.6s ease-in-out 2 forwards}@keyframes twk{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
.shoot{animation:sht 1.6s ease-in forwards}@keyframes sht{from{transform:translate(0,0)}to{transform:translate(-240px,130px);opacity:0}}
.fxflash{position:absolute;inset:0;background:#fff;animation:fxf .6s forwards}@keyframes fxf{from{opacity:.95}to{opacity:0}}
.rainfx{position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(210,230,255,.6) 9px 10px);background-size:44px 44px;animation:rainm .3s linear infinite;opacity:.85}@keyframes rainm{to{background-position:-22px 44px}}
.spdlines{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 60%,transparent 0 6deg,rgba(255,255,255,.65) 6deg 8deg);animation:fxf 1.3s forwards}
.spotfx{position:absolute;inset:0;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.4),transparent 62%)}
.numpop{position:absolute;top:30%;font-size:24px;color:#fff;text-shadow:0 2px 0 #2b2140,2px 0 0 #2b2140,-2px 0 0 #2b2140,0 -2px 0 #2b2140;animation:np 1.8s forwards;transform:translateX(-50%)}
@keyframes np{from{transform:translate(-50%,10px);opacity:0}15%{opacity:1}to{transform:translate(-50%,-56px);opacity:0}}
.scdlg{position:absolute;left:8px;right:8px;bottom:8px;background:#fffbf2f2;border:3px solid var(--ink);border-radius:12px;padding:6px 10px 8px;font-size:13.5px;line-height:1.5;min-height:58px;z-index:6;pointer-events:none}
.scwho{background:var(--pink);color:#fff;border-radius:8px;padding:0 8px;font-size:12px;margin-bottom:2px}
.scnxt{position:absolute;right:8px;bottom:2px;font-size:11px;animation:bl 1s infinite}
.scskip{position:absolute;right:6px;top:6px;z-index:7;background:#fffc;border:2px solid var(--ink);border-radius:9px;font-size:11px;padding:2px 8px}
#mbtn{position:fixed;right:max(8px,env(safe-area-inset-right));top:max(6px,env(safe-area-inset-top));z-index:15;width:38px;height:38px;border-radius:12px;border:3px solid var(--ink);background:#fffbf2;font-size:18px;line-height:1;box-shadow:0 3px 0 #0003;padding:0}
#mn{position:fixed;inset:0;z-index:40;background:#2b214099;display:flex;align-items:center;justify-content:center;padding:14px}
#mnb{width:100%;max-width:420px;max-height:100%;overflow:auto}
.st2w{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}.st2{background:#fff;border:2px solid var(--ink);border-radius:8px;text-align:center;font-size:11px;padding:2px}.st2 b{display:block;font-size:11px}.st2 span{font-size:16px;font-weight:800}
.row.hdr{padding-right:42px}
#cmt{right:54px}
.sci{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;margin-top:7px;box-shadow:0 3px 0 var(--ink);font-size:13px;line-height:1.45}
.sci.on{background:var(--gold)}.sci.lock{opacity:.5;box-shadow:none;background:#e4e4ea}
.sci .ic{font-size:30px;flex:none}
</style>

<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="cmt"></div>
<div id="toast"></div>
<button id="mbtn" class="hide" data-k="menu">☰</button>
<div id="mn" class="hide"><div id="mnb" class="panel"></div></div>
<div id="sheet" class="hide"><div id="box" class="panel"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ================= データ ================= */

 {k:"voi",n:"はっせい",e:"📣",g:{voi:14,pow:5},en:-20,bg:0xffb3c7},
 {k:"sta",n:"ランニング",e:"🏃",g:{sta:13,tru:5},en:-20,bg:0xb3e0ff},

 {k:"pol",n:"せいさく",e:"📖",g:{pol:13,tru:3},en:5,bg:0xd9c6ff}
];

const CAND=[
 {id:"nagata",n:"ながた",col:0xe0442f,hair:0x3a2a20,apt:{voi:1.10},strat:"senko",d:"声が とおる 先行タイプ。 はっせい が のびやすい！",start:{voi:60,sta:45,pow:45,tru:45,pol:45}},
 {id:"kasumi",n:"かすみ",col:0x8a5cf5,hair:0x6b3a8a,apt:{pol:1.10,tru:1.05},strat:"sashi",d:"かしこい 差しタイプ。 せいさく が のびやすい！",start:{voi:45,sta:45,pow:45,tru:50,pol:60}},
 {id:"chiyoda",n:"ちよだ",col:0x2fae6e,hair:0xc08a30,apt:{sta:1.10,pow:1.05},strat:"nige",d:"スタミナ ばつぐんの 逃げタイプ。 たいりょく が のびやすい！",start:{voi:45,sta:60,pow:50,tru:45,pol:45}}
];
const STRAT={
 nige:{n:"逃げ",d:"序盤から トップで ひっぱる。 つかれやすい",m:[1.06,1.01,.99,.97],hp:1.15},

function assign(){
 G.place={voi:[],sta:[],pow:[],tru:[],pol:[]};
 G.deck.forEach(c=>{
  const w=TR.map(t=>t.k===c.t?4:1),tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot,i=0;
  while(r>w[i]){r-=w[i];i++}
  G.place[TR[i].k].push(c);
 });
}
const isFr=(c,k)=>c.t===k&&(G.bond[c.id]||0)>=80;
function level(k){return Math.min(5,1+Math.floor(G.tcount[k]/4))}
function preview(k){
 const T=TR.find(t=>t.k===k),cs=G.place[k],L=level(k);
 let tr=0,flat=0,fr=1;
 cs.forEach(c=>{const b=cbonus(c);tr+=b.tr;flat+=b.flat;if(isFr(c,k))fr*=1+b.fr/100});
 const mf=1+.1*G.mood;
 const g={};
 for(const s in T.g){
  let base=T.g[s]+(L-1)*(s===T.k?2:0.8)+flat*(s===T.k?1:.5);
  base*=(1+tr/100)*mf*fr;base*=(G.cand.apt[s]||1);
  g[s]=Math.round(base);
 }
 const fail=G.energy>=60?0:Math.min(70,Math.round((60-G.energy)*.9));
 return{g,fail,en:T.en+(k==="pol"?0:Math.min(0,cs.length?0:0)),sp:4+cs.length,fr:cs.filter(c=>isFr(c,k)),L};
}

 runners.forEach((r,i)=>{

function cmt(t){$("cmt").style.top="max(8px,env(safe-area-inset-top))";$("cmt").innerHTML=`<div class="panel" style="font-size:13.5px;text-align:center">${t}</div>`}
function phaseOf(p){return p<PH[0]?0:p<PH[1]?1:p<PH[2]?2:3}
function runnerSpeed(r,dt){
 const b=1/36,ph=phaseOf(r.pos),S=STRAT[r.strat].m;
 let f;
 if(ph===0)f=(1+.05*(r.x.pow-1)+.02*(r.x.voi-1))*S[0];
 else if(ph===1)f=(1+.05*(r.x.voi-1)+.02*(r.x.pol-1))*S[1];
 else if(ph===2)f=(1+.05*(r.x.voi-1)+.04*(r.x.pow-1))*S[2];
 else f=(1+.07*(r.x.tru-1)+.05*(r.x.pow-1)+.04*(r.x.voi-1))*S[3];
 f*=1+(r.apt||0)+r.noise[ph];
 // スキル
 let imm=false;
 r.act=r.act.filter(a=>(a.t-=dt)>0);
 r.act.forEach(a=>{if(a.s.spd)f*=1+a.s.spd;if(a.s.immune)imm=true});
 if(r.deb>0){f*=1-r.deb;r.deb=Math.max(0,r.deb-dt*.02)}
 if(r.hp<=0&&!imm)f*=.86;
 if(r.pl&&RC.tapBoost>0)f*=1+RC.tapBoost;
 return{spd:b*f,rel:f};
}
function enterPhase(r,ph){
 r.phase=ph;
 const prob=clamp(.25+.5*r.x.pol/1.2,.2,.92);
 r.skills.forEach(id=>{
  const s=SKILLS.find(q=>q.id===id);if(!s)return;
  if(s.ph!==ph&&s.ph!==-1)return;
  if(s.ph===-1){r.act.push({s,t:99});return}
  if(r.sdone[id])return;r.sdone[id]=true;
  if(s.behind){const rk=rankList().indexOf(r)+1;if(rk<=2)return}
  if(Math.random()<prob){
   if(s.hp)r.hp=Math.min(r.hp0*1.1,r.hp+s.hp);
   if(s.deb){const top=rankList().find(q=>q!==r);if(top)top.deb=s.deb}
   r.act.push({s,t:3.2});
   if(r.pl){cmt(`✨ スキル発動！「${s.n}」`);sfx.gacha();if(r.m)flashSkill()}
  }
 });
}

function updateRace(dt){
 const p0=runners[0];
 if(RC.state==="count"){
  RC.cd-=dt;
  runners.forEach(r=>animHero(r.m,0,dt));
  const n=Math.ceil(RC.cd);
  if(RC.lastN!==n&&n>0&&n<=3){RC.lastN=n;cmt(`<span style="font-size:30px">${n}</span>`);sfx.tick()}
  if(RC.cd<=0){RC.state="run";cmt("🏁 スタート！！");sfx.win();runners.forEach(r=>{r.noise=[0,1,2,3].map(()=>rnd(-.012,.012))})}
 }else if(RC.state==="run"||RC.state==="end"){
  RC.t+=dt;
  RC.tapBoost=Math.max(0,RC.tapBoost-dt*.06);
  runners.forEach(r=>{
   if(r.fin!==null){r.pos+=r.endSp*dt*.5;animHero(r.m,.6,dt);r.m.position.x=r.pos*RC.L;return}
   const ph=phaseOf(r.pos);if(ph!==r.phase)enterPhase(r,ph);
   const{spd,rel}=runnerSpeed(r,dt);
   r.pos+=spd*dt;
   const dr=3.2*Math.pow(rel,2.5)*(ph===0?STRAT[r.strat].hp:1)*(ph===3?1.1:1);
   r.hp=Math.max(0,r.hp-dr*dt*(r.hp0/100>1?.9:1));
   if(r.pos>=1){r.fin=RC.t;r.endSp=spd;RC.finished.push(r)}
   r.m.position.x=r.pos*RC.L;animHero(r.m,1.1+rel*0.2,dt);
   r.m.position.y=Math.abs(Math.sin(r.m.userData.phase))*.18;
  });
  const near=!p0.fin&&p0.pos>.76;
  const tb=$("tap");if(tb)tb.style.visibility=near?"visible":"hidden";
  if(near&&!RC.spark){RC.spark=true;cmt("🔥 ラストスパート！ れんだで 応援しよう！")}
  if(RC.state==="run"&&p0.fin!==null){RC.state="end";RC.endT=2.2;}
  if(RC.state==="end"){RC.endT-=dt;if(RC.endT<=0||RC.finished.length>=6){RC.state="done";raceEnd()}}
  RC.msgT-=dt;
  if(RC.msgT<=0&&RC.state==="run"){
   RC.msgT=3.2;const rk=rankList(),i=rk.indexOf(p0)+1;
   if(!RC.spark)cmt(`実況「現在 ${rk[0].name} が トップ！ ${G.cand.n}は ${i}位！」`);
  }
 }
 // かめら
 const tgt=p0.m.position;
 const cx=2000+tgt.x+3,cy=13,cz=21+(runners.length-6)*3;
 if(Math.abs(cx-cam.position.x)>15)cam.position.x=cx;cam.position.x+=(cx-cam.position.x)*Math.min(1,dt*5);cam.position.y=cy;cam.position.z=cz;
 cam.lookAt(cam.position.x,0,RC.zc-1.5);
 RC.mk.position.set(p0.m.position.x,4.6+Math.sin(performance.now()/200)*.2,p0.m.position.z);RC.mk.rotation.y+=dt*3;
 // ランキング
 if(!RC.acc)RC.acc=0;RC.acc+=dt;
 if(RC.acc>.12&&$("rk")){RC.acc=0;
  const rk=rankList();
  $("rk").innerHTML=rk.map((r,i)=>`<div class="rk"><b style="width:18px">${i+1}</b><span style="width:70px;${r.pl?"color:#ffe36b":""}">${r.name}</span><div class="bar"><i style="width:${Math.min(100,r.pos*100)}%;${r.pl?"background:var(--gold)":""}"></i></div><span style="width:62px;text-align:right">${Math.round(Math.min(1,r.pos)*(r.pl?1:1)*(8000+Math.round(r.x.pol*1000)))}票</span></div>`).join("");
 }
}

function gcLoop(){
 if(!GC)return;
 const now=performance.now(),dt=Math.min(.05,(now-GC.last)/1000);GC.last=now;
 const ctx=GC.ctx,W=ctx.canvas.width,H=ctx.canvas.height;ctx.clearRect(0,0,W,H);

 GC.parts=GC.parts.filter(p=>{p.life-=dt;if(p.life<=0)return false;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;

function playScene(o){
 const box=$("scn");if(!box)return;
 SC={o,def:o.actors||{},beats:o.beats||[],i:0,typing:null,wait:"",timer:0,tm:[],ended:false,bg:o.bg};
 box.setAttribute("data-k","sctap");
 box.innerHTML=`<div class="scbg" id="scbg">${bgSVG(o.bg)}</div><div id="scact"></div><div id="scfx"></div><div class="scdlg hide" id="scdlg"><span class="scwho" id="scwho"></span><div id="sctxt"></div><span class="scnxt">▼</span></div><button class="scskip" data-k="scskip">スキップ ⏭</button>`;
 Object.keys(SC.def).forEach(k=>{if(SC.def[k].at)scPlace(k,SC.def[k].at[0],SC.def[k].at[1]||0,SC.def[k].anim)});
 if(o.fx)o.fx.split(" ").forEach(scFx);
 setTimeout(scBeat,350);
}
function scEl(k){
 let el=$("act_"+k);if(el)return el;
 const d=SC.def[k];el=document.createElement("div");el.id="act_"+k;el.className="act";
 el.style.setProperty("--w",(d.w||(d.html.includes("chibi")?78:d.html.includes("bust")?96:56))+"px");
 el.innerHTML=`<div class="ain">${d.html}</div>`;if(d.flip)el.classList.add("flip");
 $("scact").appendChild(el);return el;
}
function scPlace(k,x,y,anim){const el=scEl(k);el.style.left=x+"%";el.style.bottom=(30+(y||0))+"%";if(anim)scAnim(k,anim);return el}
function scAnim(k,an){const el=$("act_"+k);if(!el)return;const a=el.querySelector(".ain");a.className="ain "+(an&&an!=="none"?"a-"+an:"")}
function scAct(a){
 if(!SC)return;const k=a.a;if(!SC.def[k])return;
 let el=$("act_"+k);
 if(!el){
  el=scEl(k);
  const side=a.enter;
  if(side==="left"){el.style.left="-25%";el.style.bottom=(30+(a.y||0))+"%"}
  else if(side==="right"){el.style.left="125%";el.style.bottom=(30+(a.y||0))+"%"}
  else if(side==="top"){el.style.left=a.x+"%";el.style.bottom="130%"}
  else{el.style.left=(a.x!==undefined?a.x:50)+"%";el.style.bottom=(30+(a.y||0))+"%";el.classList.add("popin");setTimeout(()=>el.classList.remove("popin"),500)}
  void el.offsetWidth;
 }
 if(a.x!==undefined)el.style.left=a.x+"%";
 if(a.y!==undefined||a.enter)el.style.bottom=(30+(a.y||0))+"%";
 if(a.flip!==undefined)el.classList.toggle("flip",!!a.flip);
 if(a.s)el.style.setProperty("--s",a.s);
 if(a.z)el.style.zIndex=a.z;
 if(a.anim)scAnim(k,a.anim);
 if(a.exit){el.style.left=a.exit==="left"?"-30%":"130%";SC.tm.push(setTimeout(()=>el.remove(),900))}
 if(a.hide)el.style.opacity=0;
}
function scBeat(){
 if(!SC||SC.ended)return;if(!$("scn")){SC=null;return}
 const b=SC.beats[SC.i++];
 if(!b)return scEnd();
 if(b.bg&&b.bg!==SC.bg){SC.bg=b.bg;const bg=$("scbg");const n=document.createElement("div");n.className="scbg2";n.innerHTML=bgSVG(b.bg);bg.appendChild(n);setTimeout(()=>{bg.innerHTML=n.innerHTML;},700)}
 (b.acts||[]).forEach(scAct);
 if(b.fx)b.fx.split(" ").forEach(scFx);
 if(b.pop)scPop(b.pop);
 const dlg=$("scdlg");
 if(b.say){
  dlg.classList.remove("hide");$("scwho").textContent=b.who||"";$("scwho").style.display=b.who?"inline-block":"none";
  const t=b.say;let n=0;const el=$("sctxt");el.textContent="";SC.wait="type";
  clearInterval(SC.typing);
  SC.typing=setInterval(()=>{n++;el.textContent=t.slice(0,n);if(n%3===0)beep(620+(n%5)*30,.02,"square",.015);if(n>=t.length){clearInterval(SC.typing);SC.typing=null;SC.wait="tap";if(SC.i>=SC.beats.length&&SC.o.keepDlg)scEnd()}},34);
  SC.full=t;
 }else{
  SC.wait="auto";if(b.hide!==false&&!b.keep)dlg.classList.add("hide");
  SC.timer=setTimeout(scBeat,b.wait||1000);
 }
}
function scTap(){
 if(!SC||SC.ended)return;
 if(SC.wait==="type"){clearInterval(SC.typing);SC.typing=null;$("sctxt").textContent=SC.full;SC.wait="tap";return}

}
function scSkip(){
 if(!SC||SC.ended)return;
 clearInterval(SC.typing);clearTimeout(SC.timer);
 // さいごまで 状態を てきよう
 while(SC.i<SC.beats.length){const b=SC.beats[SC.i++];(b.acts||[]).forEach(a=>{if(a.exit)return;scAct(Object.assign({},a,{anim:a.anim}))});if(b.bg)SC.bg=b.bg}

}
function scEnd(){

function scPop(p){const f=$("scfx");if(!f)return;const e=document.createElement("div");e.className="numpop";e.textContent=p.t;e.style.left=(p.x||50)+"%";f.appendChild(e);setTimeout(()=>e.remove(),1800)}
function scFx(n){
 const f=$("scfx"),box=$("scn");if(!f||!box)return;
 const B=(em,cnt,mode)=>{for(let i=0;i<cnt;i++){const e=document.createElement("span");e.className="fxp "+mode;e.textContent=em[Math.floor(Math.random()*em.length)];e.style.left=rnd(4,94)+"%";e.style.animationDelay=rnd(0,.8)+"s";e.style.fontSize=rnd(16,30)+"px";if(/popfx|twinkle|shoot/.test(mode))e.style.top=rnd(6,60)+"%";f.appendChild(e);setTimeout(()=>e.remove(),3200)}};
 const flash=()=>{const e=document.createElement("div");e.className="fxflash";f.appendChild(e);setTimeout(()=>e.remove(),700)};
 switch(n){
  case"confetti":B(["🎉","✨","🎊","⭐","💖"],26,"fall");sfx.ok();break;
  case"sparkle":B(["✨","⭐"],14,"rise");beep(1100,.08,"triangle",.04);break;
  case"hearts":B(["💕","💖"],10,"rise");break;
  case"notes":B(["🎵","🎶"],12,"rise");break;
  case"petals":B(["🌸"],20,"fall");break;
  case"sweat":B(["💦"],6,"rise");sfx.bad();break;
  case"anger":B(["💢"],4,"popfx");break;
  case"stars":B(["⭐","✨","🌠"],18,"twinkle");break;
  case"question":B(["❓","❗"],3,"popfx");break;
  case"idea":B(["💡"],2,"popfx");beep(1300,.1,"triangle",.05);break;
  case"flash":flash();break;
  case"camera":flash();B(["📸"],3,"popfx");setTimeout(flash,350);break;
  case"lightning":flash();B(["⚡"],3,"popfx");sfx.bad();box.classList.add("shk");setTimeout(()=>box.classList.remove("shk"),500);break;
  case"shake":box.classList.add("shk");setTimeout(()=>box.classList.remove("shk"),500);break;
  case"rain":if(!f.querySelector(".rainfx")){const r=document.createElement("div");r.className="rainfx";f.appendChild(r)}break;
  case"norain":{const r=f.querySelector(".rainfx");r&&r.remove()}break;
  case"dark":box.classList.add("dark");break;
  case"light":box.classList.remove("dark");break;
  case"lines":{const e=document.createElement("div");e.className="spdlines";f.appendChild(e);setTimeout(()=>e.remove(),1400)}break;
  case"spot":{const e=document.createElement("div");e.className="spotfx";f.appendChild(e)}break;
  case"shoot":B(["🌠"],2,"shoot");break;
 }
}

function resolveEp(v){
 const c=G.curCard,n=G.curEp;G.ep[c.id]=n+1;
 let gain;
 if(+v===0){addBond(c,10);gain=8+n*2;G.st[c.t]+=gain}else{addBond(c,8);G.energy-=10;gain=14+n*3;G.st[c.t]+=gain;G.st.tru+=2}
 let extra="";
 if(n===2){
  const sp=c.vet?40:25;G.sp+=sp;
  const un=SKILLS.filter(s=>!G.skills.includes(s.id));
  let hint="";if(un.length){const s=pick(un);G.hints[s.id]=Math.max(G.hints[s.id]||0,c.vet?.5:.3);hint=`🔖 スキル「${s.n}」の ヒント！ `}
  extra=`<div class="memo"><b>📖 きずなの 物語 かんけつ！</b><br>${hint}SP +${sp}</div>`;
 }
 normS();sfx.ok();
 const T=TANIM[c.t],bg=BGMAP[c.id]||"town";
 sheet(`<h2>${c.e} ${c.n}</h2>`+sceneBox());
 const act=epActors(c);act.h.at=[+v===0?30:34,0];act.c.at=[68,0];act.p.at=[50,50];
 playScene({bg,actors:act,beats:[{acts:[{a:"h",anim:"jump"},{a:"c",anim:"bounce"},{a:"p",anim:"spin"}],fx:n===2?"confetti sparkle":"sparkle",pop:{t:`${SN[c.t]} +${gain}`,x:30},say:c.eps[n][1],keep:true}],
  keepDlg:true,hideEnd:false,onEnd:()=>{$("scopts").innerHTML=extra+`<button class="btn" data-k="next">つぎへ</button>`}});
}

function turnEvent(){
 if(!G)return;
 const present=G.deck.filter(c=>Object.values(G.place).some(a=>a.includes(c)));
 const TH=[30,55,80];
 for(const c of shuffle(present)){const n=G.ep[c.id]||0;if(n<3&&(G.bond[c.id]||0)>=TH[n]&&Math.random()<.85)return epSheet(c,n)}
 const r=Math.random();
 const used=Object.keys(G.evtUsed).length;
 if(r<.2&&used<G.evtOrder.length){const key=G.evtOrder[used];G.evtUsed[key]=true;return evtStart(key)}
 const vc=G.deck.find(c=>c.vet);
 if(vc&&r>.9){
  const v=vc;sheet(`<h2>🏛️ ${VET}</h2>`+sceneBox());
  return playScene({bg:"gov",actors:{h:hAct(),v:cardAct(v)},beats:[{acts:[{a:"h",enter:"left",x:28,anim:"walk"},{a:"v",enter:"right",x:72,anim:"walk"}],wait:900},{acts:[{a:"v",anim:"nod"}],fx:"question",say:`${VET}「…ひとつ、 助言を やろう。」`,who:VET}],keepDlg:true,hideEnd:false,onEnd:()=>{$("scopts").innerHTML=`<button class="btn" data-k="vet">ありがとうございます！</button>`}});
 }
 if(r<.5&&G.deck.length&&present.length){
  const c=pick(present),se=pick([SEV.a,SEV.b]);G.curCard=c;G.curSev=se;
  return cardScene(c,se.q(c.n),se.c.map((x,i)=>`<button class="opt" data-k="sev" data-v="${i}">${x.l}</button>`).join(""));
 }
 nextTurn();
}

function debPick(i){
 const d=G.deb,good=COUNTER[d.type]===i;
 const p=(good?.78:.28)+clamp((avg()/G.NORM-.5)*.2,-.1,.12);
 const win=Math.random()<p;if(win)d.w++;d.r++;
 sfx[win?"ok":"bad"]();
 const em=["📊","🗣️","🌈"][i===0?1:i===1?2:0];
 sheet(`<h2>🎤 公開討論会 ${d.r}/3</h2>`+sceneBox());
 playScene({bg:"hall",actors:{h:Object.assign(hAct(),{at:[26,0]}),r:Object.assign(npcAct("rival"),{at:[74,0]}),e:emoAct(em,56)},beats:[
  {acts:[{a:"h",anim:"cheer"},{a:"e",enter:"pop",x:30,y:56,anim:"float"}],wait:500},
  {acts:[{a:"e",x:70,y:56},{a:"r",anim:win?"shake":"jump"},{a:"h",anim:win?"jump":"droop"}],fx:win?"flash confetti":"sweat anger",say:win?"✅ 論破！ 会場が ざわめく！":"❌ 押し返された…！",keep:true}],
  keepDlg:true,hideEnd:false,endWait:900,onEnd:()=>debRound()});
}

/* ---- メニュー／やめる ---- */
function setMenuBtn(on){$("mbtn").classList.toggle("hide",!on)}
function openMenu(){
 if(!G)return;paused=true;
 const nm=SK.map(k=>`<div class="st2"><b>${SN[k]}</b><span>${G.st[k]}</span></div>`).join("");
 $("mn").classList.remove("hide");
 $("mnb").innerHTML=`<h2>☰ メニュー</h2>
  <p style="margin:0;font-size:12.5px">${G.cand.n}　第${Math.min(G.t,G.N)}/${G.N}ターン　元気 ${G.energy}　SP ${G.sp}</p>
  <div class="st2w">${nm}</div>
  <p style="font-size:12px;margin:4px 0">スキル：${G.skills.length?G.skills.map(id=>SKILLS.find(x=>x.id===id).n).join("、"):"なし"}</p>
  <button class="btn" data-k="menuClose">▶ つづける</button>
  <button class="btn sub" data-k="menuSound">${soundOn?"🔊 サウンド：ON":"🔇 サウンド：OFF"}</button>
  <button class="btn sub" style="color:#c33" data-k="menuQuit">🚪 途中で やめる</button>`;
}
function closeMenu(){$("mn").classList.add("hide");paused=false}
function menuQuitAsk(){
 $("mnb").innerHTML=`<h2>🚪 やめますか？</h2><p>ここまでの 育成は <b>きろくに のこりません</b>。 ホームに もどります。</p>
  <button class="btn sub" data-k="menuClose">つづける</button><button class="btn pk" data-k="menuQuitGo">やめる</button>`;
}
function quitRun(){
 closeMenu();
 if(SC){SC.ended=true;clearInterval(SC.typing);clearTimeout(SC.timer);SC.tm.forEach(clearTimeout);SC=null}
 if(GC)gcEnd(false);
 closeSheet();G=null;RC=null;hideBar();
 home();
}
function hideBar(){$("cmt").innerHTML=""}
addEventListener("keydown",e=>{if(e.code==="Escape"&&G){if($("mn").classList.contains("hide"))openMenu();else closeMenu()}});

title();frame();
</script>
